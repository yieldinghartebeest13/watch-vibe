name: Release

on:
  push:
    tags:
      - "release*"
      - "beta*"

permissions:
  contents: write

jobs:
  release:
    name: Release from ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # ── Build both APKs ──────────────────────────────

      - name: Build WearVibe (watch)
        working-directory: wear-vibe
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Build WearVibeControl (phone)
        working-directory: vibe-control
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      # ── Sign both APKs ───────────────────────────────

      - name: Decode production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Sign WearVibe APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            wear-vibe/app/build/outputs/apk/release/app-release-unsigned.apk

          mv wear-vibe/app/build/outputs/apk/release/app-release-unsigned.apk \
             wear-vibe/app/build/outputs/apk/release/WearVibe.apk

      - name: Sign WearVibeControl APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            vibe-control/app/build/outputs/apk/release/app-release-unsigned.apk

          mv vibe-control/app/build/outputs/apk/release/app-release-unsigned.apk \
             vibe-control/app/build/outputs/apk/release/WearVibeControl.apk

      # ── Changelog ────────────────────────────────────

      - name: Generate changelog
        id: changelog
        run: |
          # Determine tag series (release or beta)
          if [[ "$GITHUB_REF_NAME" == release* ]]; then
            TAG_SERIES="release"
          else
            TAG_SERIES="beta"
          fi

          echo "Tag series: $TAG_SERIES"
          echo "Current tag: $GITHUB_REF_NAME"

          # Find previous tag in the same series
          PREV_TAG=$(git tag --list "${TAG_SERIES}*" --sort=-creatordate \
            | grep -v "^${GITHUB_REF_NAME}$" \
            | head -1)

          echo "Previous tag: ${PREV_TAG:-none (first release)}"

          {
            echo "## ${TAG_SERIES^} — ${GITHUB_REF_NAME}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Changes since \`${PREV_TAG}\`:**"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${GITHUB_REF_NAME}"
              echo ""
              echo ""
              echo "**Full diff:** [\`${PREV_TAG}...${GITHUB_REF_NAME}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME})"
            else
              echo "**Initial ${TAG_SERIES} release**"
              echo ""
              git log --pretty=format:"- %s (%h)"
              echo ""
            fi
          } > /tmp/CHANGELOG.md

          cat /tmp/CHANGELOG.md

      # ── Create GitHub Release ─────────────────────────

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/CHANGELOG.md
          files: |
            wear-vibe/app/build/outputs/apk/release/WearVibe.apk
            vibe-control/app/build/outputs/apk/release/WearVibeControl.apk
          prerelease: ${{ startsWith(github.ref_name, 'beta') }}
          fail_on_unmatched_files: true
          generate_release_notes: false
