name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - beta
      version:
        description: 'Version number (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: ${{ inputs.type }}${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # ── Build both APKs ──────────────────────────────

      - name: Build WatchVibe (watch)
        working-directory: watch-vibe
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Build WatchVibeControl (phone)
        working-directory: watch-vibe-control
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      # ── Sign both APKs ───────────────────────────────

      - name: Decode production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Sign WatchVibe APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            watch-vibe/app/build/outputs/apk/release/app-release-unsigned.apk

          mv watch-vibe/app/build/outputs/apk/release/app-release-unsigned.apk \
             watch-vibe/app/build/outputs/apk/release/WatchVibe.apk

      - name: Sign WatchVibeControl APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            watch-vibe-control/app/build/outputs/apk/release/app-release-unsigned.apk

          mv watch-vibe-control/app/build/outputs/apk/release/app-release-unsigned.apk \
             watch-vibe-control/app/build/outputs/apk/release/WatchVibeControl.apk

      # ── Changelog ────────────────────────────────────

      - name: Generate changelog
        id: changelog
        env:
          TAG_NAME: ${{ inputs.type }}${{ inputs.version }}
          TAG_SERIES: ${{ inputs.type }}
        run: |
          echo "Tag:      $TAG_NAME"
          echo "Series:   $TAG_SERIES"

          # Find previous tag in the same series
          PREV_TAG=$(git tag --list "${TAG_SERIES}*" --sort=-creatordate \
            | grep -v "^${TAG_NAME}$" \
            | head -1)

          echo "Previous: ${PREV_TAG:-none (first release)}"

          {
            echo "## ${TAG_SERIES^} — ${TAG_NAME}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Changes since \`${PREV_TAG}\`:**"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
              echo ""
              echo ""
              echo "**Full diff:** [\`${PREV_TAG}...${TAG_NAME}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG_NAME})"
            else
              echo "**Initial ${TAG_SERIES} release**"
              echo ""
              git log --pretty=format:"- %s (%h)"
              echo ""
            fi
          } > /tmp/CHANGELOG.md

          cat /tmp/CHANGELOG.md

      # ── Create tag and GitHub Release ────────────────

      - name: Create tag
        env:
          TAG_NAME: ${{ inputs.type }}${{ inputs.version }}
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG_NAME already exists — skipping tag creation"
          else
            git tag -a "$TAG_NAME" -m "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.type }}${{ inputs.version }}
          name: ${{ inputs.type }}${{ inputs.version }}
          body_path: /tmp/CHANGELOG.md
          files: |
            watch-vibe/app/build/outputs/apk/release/WatchVibe.apk
            watch-vibe-control/app/build/outputs/apk/release/WatchVibeControl.apk
          prerelease: ${{ inputs.type == 'beta' }}
          fail_on_unmatched_files: true
          generate_release_notes: false
